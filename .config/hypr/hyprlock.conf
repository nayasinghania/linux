general {
    hide_cursor = true
    disable_loading_bar = true
}

background {
    color = rgb(1e1e2e)
}

input-field {
    size = 250, 50
    position = 0, -80
    halign = center
    valign = center

    rounding = 10
    outline_thickness = 2
    inner_color = rgb(313244)
    outer_color = rgb(89b4fa)
    font_color = rgb(cdd6f4)

    placeholder_text = <i>Password...</i>
}

label {
    text = $TIME
    font_size = 64
    color = rgb(cdd6f4)
    position = 0, 80
    halign = center
    valign = center
}
