$font = Monospace

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 10%, 5%
    outline_thickness = 2

    font_color = rgb(0, 0, 0)
    fade_on_empty = false
    rounding = 10

    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL$FPRINTFAIL

    position = 0, -100
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = $font
    halign = center
    valign = center
}
